[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiq_travel_agent"
version = "0.1.0"
description = "Travel AI Agent using Google Flights API"
requires-python = ">=3.8"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["aiq_travel_agent"]