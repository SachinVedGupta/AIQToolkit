general:
  use_uvloop: true

functions:
  extract_travel_requirements:
    _type: aiq.tool/extract_travel_requirements
    llm: travel_llm
    root_path: "./examples/por_to_jiratickets/data/"

  search_flights:
    _type: aiq.tool/search_flights
    root_path: "../../../data/"
    api_key: "ed32a1a9f2362ccb866a496e7c807774660bd23aff2f2ed3693b6f8fd261202b"
    llm: travel_llm

llms:
  travel_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.7
    max_tokens: 4096

workflow:
  _type: react_agent
  llm_name: 23223_llm
  tool_names:
    - extract_travel_requirements
    - search_flights
  verbose: true



functions:
  extract_por_tool:
    _type: extract_por_tool
    llm: extract_llm
    root_path: "./examples/por_to_jiratickets/data/"
  show_jira_tickets:
    _type: show_jira_tickets
    root_path: "./examples/por_to_jiratickets/data/"
  create_jira_tickets_tool:
    _type: create_jira_tickets_tool
    root_path: "./examples/por_to_jiratickets/data/"
    timeout: 20.0
    connect: 10.0
    jira_domain: ""
    jira_project_key: ""
  get_jira_tickets_tool:
    _type: get_jira_tickets_tool
    root_path: "./examples/por_to_jiratickets/data/"
    jira_domain: ""
    jira_project_key: ""

llms:
  extract_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    # model_name: "deepseek-ai/deepseek-r1"
    temperature: 0.0
    seed : 33
    max_tokens: 2000
  agent_llm:
    _type: nim
    # model_name: "deepseek-ai/deepseek-r1"
    # model_name: mistralai/mixtral-8x22b-instruct-v0.1
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.0
    seed : 33
    max_tokens: 2000

workflow:
  _type: react_agent
  llm_name: agent_llm
  tool_names:
   - extract_por_tool
   - show_jira_tickets
   - create_jira_tickets_tool
   - get_jira_tickets_tool
  verbose: true
